project_id = "aptohire-backend"

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
enable_graphql = false

[db]
major_version = 15

[auth]
enable_signup = true
enable_confirmations = true
minimum_password_length = 10
jwt_expiry = 3600
enable_refresh_token_rotation = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "http://localhost:5174/**", "http://localhost:5175/**", "http://localhost:5176/**", "http://localhost:5177/**"]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
# Re-check hosted plan limits; Supabase free tier may change.
file_size_limit = "50MiB"

[auth.email]
enable_signup = true
double_confirm_changes = true

[auth.email.template]

[local_smtp]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

# Only functions with an existing entrypoint are configured here.
[functions.public-verify]
import_map = "./functions/import_map.json"
verify_jwt = false

[functions.submit-application]
import_map = "./functions/import_map.json"
verify_jwt = false

# Callback uses single-use HMAC state; authenticated POST actions still verify JWT in the handler.
[functions.profile-sync]
import_map = "./functions/import_map.json"
verify_jwt = false

[functions.submit-project]
import_map = "./functions/import_map.json"
verify_jwt = true

